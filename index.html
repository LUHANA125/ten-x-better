<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Zambian Class System</title>

<style>
body{
font-family:Arial, sans-serif;
margin:0;
background:#f1f5f9;
}

.container{
max-width:1000px;
margin:auto;
padding:20px;
}

.card{
background:white;
padding:20px;
border-radius:10px;
margin-bottom:20px;
box-shadow:0 4px 10px rgba(0,0,0,0.05);
}

h1{
text-align:center;
color:#1e3a8a;
}

button{
padding:10px 15px;
background:#1e3a8a;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
margin:5px 0;
}

select,input{
padding:8px;
border-radius:6px;
border:1px solid #ccc;
margin:5px 0;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#1e3a8a;
color:white;
padding:10px;
}

td{
padding:8px;
border-bottom:1px solid #ddd;
}

.grade-good{color:green;font-weight:bold;}
.grade-mid{color:orange;font-weight:bold;}
.grade-bad{color:red;font-weight:bold;}

#saveMessage{
color:green;
font-weight:bold;
}

</style>
</head>

<body>

<div class="container">

<h1>📚 Smart Zambian Class System</h1>

<div class="card">
<h3>Add Student</h3>

<input type="text" id="studentName" placeholder="Student Name">

<select id="gender">
<option value="Male">Male</option>
<option value="Female">Female</option>
</select>

<button onclick="addStudent()">Add Student</button>

<br><br>

<select id="subject" onchange="loadData()">
<option>Mathematics</option>
<option>English</option>
<option>Science</option>
<option>Social Studies</option>
</select>

<select id="term" onchange="loadData()">
<option>Term 1</option>
<option>Term 2</option>
<option>Term 3</option>
</select>

</div>

<div class="card">
<table>
<thead>
<tr>
<th>Name</th>
<th>Gender</th>
<th>Score</th>
<th>Grade</th>
<th>Remark</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>
</div>

<div class="card">
<h3>Class Average</h3>
<canvas id="chart" height="120"></canvas>
</div>

<div class="card" style="text-align:center;">
<button onclick="manualSave()">Save Class Data</button>
<button onclick="exportCSV()">Export to Excel</button>
<button onclick="window.print()">Export to PDF</button>
<p id="saveMessage"></p>
</div>

</div>

<script>

let pupils=[];

/* STORAGE KEY */
function key(){
return subject.value+"-"+term.value;
}

/* ADD STUDENT */
function addStudent(){
let name=document.getElementById("studentName").value.trim();
let gender=document.getElementById("gender").value;

if(!name) return alert("Enter student name");

pupils.push({
name:name,
gender:gender,
score:0
});

document.getElementById("studentName").value="";
saveData();
render();
}

/* GRADE SYSTEM */
function grade(score){
if(score>=75)return {g:1,r:"Distinction",c:"grade-good"};
if(score>=65)return {g:3,r:"Merit",c:"grade-mid"};
if(score>=50)return {g:6,r:"Credit",c:"grade-mid"};
if(score>=40)return {g:8,r:"Pass",c:"grade-mid"};
return {g:9,r:"Fail",c:"grade-bad"};
}

/* UPDATE SCORE */
function update(i,val){
let s=parseInt(val)||0;
s=Math.max(0,Math.min(100,s));
pupils[i].score=s;
saveData();
render();
}

/* RENDER */
function render(){
table.innerHTML=pupils.map((p,i)=>{
let g=grade(p.score);
return `
<tr>
<td>${p.name}</td>
<td>${p.gender}</td>
<td><input type="number" value="${p.score}"
oninput="update(${i},this.value)" style="width:70px"></td>
<td class="${g.c}">${g.g}</td>
<td>${g.r}</td>
</tr>
`;
}).join("");

drawChart();
}

/* SAVE */
function saveData(){
localStorage.setItem(key(),JSON.stringify(pupils));
}

function manualSave(){
saveData();
document.getElementById("saveMessage").innerText="✔️ Data Saved!";
setTimeout(()=>{document.getElementById("saveMessage").innerText="";},3000);
}

/* LOAD */
function loadData(){
let data=localStorage.getItem(key());
if(data){
pupils=JSON.parse(data);
render();
}else{
pupils=[];
table.innerHTML="";
drawChart();
}
}

/* EXPORT CSV */
function exportCSV(){
let csv="Name,Gender,Score,Grade,Remark\n";
pupils.forEach(p=>{
let g=grade(p.score);
csv+=${p.name},${p.gender},${p.score},${g.g},${g.r}\n;
});
let blob=new Blob([csv],{type:"text/csv"});
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="class_report.csv";
a.click();
}

/* CHART */
function drawChart(){
let ctx=chart.getContext("2d");
ctx.clearRect(0,0,chart.width,chart.height);

let avg=0;
if(pupils.length){
avg=pupils.reduce((a,b)=>a+b.score,0)/pupils.length;
}

ctx.fillStyle="#1e3a8a";
ctx.fillRect(20,50,avg*3,30);
ctx.fillStyle="black";
ctx.fillText("Average: "+Math.round(avg)+"%",20,40);
}

/* LOAD ON START */
window.onload=loadData;

</script>

</body>
</html>
